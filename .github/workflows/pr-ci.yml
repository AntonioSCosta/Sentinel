name: PR CI

on: pull_request

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify Sentinel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: >-
          git ls-files --cached -z --
          ':(glob)src/**/*.js' ':(glob)src/**/*.mjs'
          ':(glob)tests/**/*.js' ':(glob)tests/**/*.mjs'
          ':(glob)tools/**/*.js' ':(glob)tools/**/*.mjs'
          ':(exclude,glob)**/node_modules/**' ':(exclude,glob)**/vendor/**'
          | xargs -0 -r -n 1 node --check --
      - name: Run unit tests and catalogue checks
        run: npm test
      - name: Run smoke tests
        run: npm run smoke
      - name: Validate exported map assets
        run: node tools/check-map-assets.mjs
